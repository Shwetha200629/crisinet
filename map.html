<!DOCTYPE html>
<html>
<head>
    <title>Hotel Map</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body { margin: 0; font-family: Arial; }
        #map { height: 100vh; }
        .title {
            position: absolute;
            z-index: 1000;
            background: white;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="title">🏨 Crisis Map</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

    // 1. Create map (default view)
    const map = L.map('map').setView([12.9716, 77.5946], 15);

    // 2. Load tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 3. Load hotel
    async function loadHotel() {
        const res = await fetch('/api/hotel');
        const hotel = await res.json();

        map.setView([hotel.lat, hotel.lng], 17);

        L.marker([hotel.lat, hotel.lng])
            .addTo(map)
            .bindPopup("🏨 " + hotel.name)
            .openPopup();
    }

    // 4. Load alerts
    async function loadAlerts() {
        const res = await fetch('/api/alerts');
        const alerts = await res.json();

        alerts.forEach(alert => {

            if (alert.lat && alert.lng) {

                let color = "red";
                if (alert.type === "Medical") color = "green";
                if (alert.type === "Security") color = "blue";

                L.circleMarker([alert.lat, alert.lng], {
                    radius: 10,
                    color: color
                }).addTo(map)
                .bindPopup(
                    `<b>${alert.type}</b><br>
                     ${alert.location}<br>
                     Status: ${alert.status}`
                );
            }
        });
    }

    // RUN BOTH
    loadHotel();
    loadAlerts();

</script>

</body>
</html>
