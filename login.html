<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CrisisNet — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #0D1B2A;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: radial-gradient(ellipse at 20% 50%, rgba(230,57,70,0.12) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(29,53,87,0.4) 0%, transparent 60%);
}
.container {
  width: 100%; max-width: 420px;
  padding: 20px;
  animation: fadeIn 0.5s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.logo {
  text-align: center;
  margin-bottom: 40px;
}
.logo-icon {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, #E63946, #c1121f);
  border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin-bottom: 16px;
  box-shadow: 0 8px 32px rgba(230,57,70,0.35);
}
.logo h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 2rem; font-weight: 700;
  color: #F1FAEE;
  letter-spacing: 2px;
}
.logo p {
  color: #8899AA;
  font-size: 0.85rem;
  margin-top: 4px;
}
.card {
  background: #162032;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 36px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.4);
}
.card h2 {
  font-size: 1.2rem; font-weight: 600;
  color: #F1FAEE;
  margin-bottom: 24px;
  text-align: center;
}
.form-group { margin-bottom: 18px; }
label {
  display: block;
  font-size: 0.78rem;
  color: #8899AA;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: #F1FAEE;
  font-size: 0.95rem;
  font-family: 'Inter', sans-serif;
  transition: border-color 0.2s;
  outline: none;
}
input:focus { border-color: #E63946; background: rgba(230,57,70,0.05); }
.btn-login {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #E63946, #c1121f);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 1rem;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(230,57,70,0.4); }
.error {
  color: #E63946; font-size: 0.85rem;
  text-align: center; margin-top: 12px;
  display: none;
}
.quick-login {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.quick-login p {
  font-size: 0.78rem; color: #8899AA;
  text-align: center; margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 1px;
}
.quick-btns { display: flex; gap: 8px; }
.quick-btn {
  flex: 1; padding: 10px 6px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  color: #8899AA;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
  text-align: center;
}
.quick-btn:hover { border-color: #E63946; color: #F1FAEE; background: rgba(230,57,70,0.1); }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">🚨</div>
    <h1>CRISISNET</h1>
    <p>Hospitality Emergency Response System</p>
  </div>
  <div class="card">
    <h2>Sign In to Continue</h2>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="off"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password"/>
    </div>
    <button class="btn-login" onclick="login()">Login →</button>
    <div class="error" id="error">Invalid credentials. Try again.</div>
    <div class="quick-login">
      <p>Quick Login</p>
      <div class="quick-btns">
        <div class="quick-btn" onclick="quickLogin('manager','manager123')">👔 Manager</div>
        <div class="quick-btn" onclick="quickLogin('staff','staff123')">👷 Staff</div>
        <div class="quick-btn" onclick="quickLogin('security','security123')">🔒 Security</div>
      </div>
    </div>
  </div>
</div>
<script>
function quickLogin(user, pass) {
  document.getElementById('username').value = user;
  document.getElementById('password').value = pass;
  login();
}
async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!username || !password) return;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (data.success) {
      if (data.role === 'Staff' || data.role === 'Security') {
        window.location.href = `/staff?username=${username}`;
      } else {
        window.location.href = `/dashboard?role=${data.role}&username=${username}`;
      }
    } else {
      document.getElementById('error').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('error').style.display = 'block';
  }
}
document.addEventListener('keypress', e => { if(e.key==='Enter') login(); });
</script>
</body>
</html>
